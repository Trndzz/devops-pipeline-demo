<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Demo Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 320px;
        }

        h1 {
            color: #2563eb;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 12px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            background: #2563eb;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            color: #15803d;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>DevOps Demo</h1>
        <p>Welcome to our Spring Boot application!</p>

        <form action="/greet" method="post">
            <input type="text"
                   name="name"
                   placeholder="Enter your name"
                   required>

            <br>

            <button type="submit">Submit</button>
        </form>

        <p class="message"
           th:if="${message != null}"
           th:text="${message}">
        </p>
    </div>
</body>
</html>
